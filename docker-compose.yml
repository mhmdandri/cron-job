services:
  cron-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shipment-cron-job
    restart: always
    networks:
      - moha_network
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TARGET_URL=https://shipment.mohaproject.tech/api/cron/monitor
      - BEARER_TOKEN=KMASLDKMNOINFNKmknsnqiwjij19980jn
      - CRON_SCHEDULE=15m
    env_file:
      - .env
networks:
  moha_network:
    external: true
